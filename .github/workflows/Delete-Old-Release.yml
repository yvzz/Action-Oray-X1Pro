name: Delete Old Release

on:
  # push:
  #   branches: [ main, master ]
  schedule:
    - cron: 0 16 * * 1     # 每周一 00:00 北京时间（UTC+8）＝ UTC 周日 16:00
  workflow_dispatch:
    inputs:

      # ─── 清理对象 ───
      do_tags:
        description: '清理孤立 Tag（无关联 Release 的 Tag）'
        required: false
        type: boolean
        default: true

      do_releases:
        description: '清理旧式日期 tag 的 Release（固定 tag 永不删）'
        required: false
        type: boolean
        default: false




# ──────────────────────────────────────────────
jobs:

  # ════════════════════════════════════════════
  #  清理孤立 Tag
  # ════════════════════════════════════════════
  delete-tags:
    name: Delete Orphan Tags
    needs: delete-releases
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 在 Delete Old Releases 完成后执行：release 被删后其 tag 才变"孤立"，再清理才彻底
    # 兼容 delete-releases 被 skipped 的场景（push 触发 / 未勾选 do_releases / 手动默认）
    if: ${{ (github.event_name == 'push' || inputs.do_tags || github.event_name == 'schedule') && (needs.delete-releases.result == 'success' || needs.delete-releases.result == 'skipped' || needs.delete-releases.result == 'failure') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete orphan tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO=${{ github.repository }}
          echo "获取所有 Remote Tag..."
          remote_tags=$(gh api "repos/$REPO/git/matching-refs/tags" --paginate --jq '.[].ref' 2>/dev/null)

          if [ -z "$remote_tags" ]; then
            echo "没有 Tag"
            exit 0
          fi

          deleted=0
          for ref in $remote_tags; do
            tag=$(echo "$ref" | sed 's|^refs/tags/||')
            release=$(gh release view "$tag" --json tagName --jq '.tagName' 2>/dev/null || true)
            if [ -z "$release" ]; then
              echo "  删除孤立 Tag: $tag"
              if gh api --method DELETE "repos/$REPO/git/refs/tags/$tag" \
                   --silent 2>/tmp/nps_delete_err.log; then
                deleted=$((deleted + 1))
                echo "    ✓ 已删除"
              else
                echo "    ⚠ 删除失败: $(cat /tmp/nps_delete_err.log)"
              fi
            else
              echo "  保留 (有 Release): $tag"
            fi
          done

          echo ""
          echo "完成: 删除 ${deleted} 个孤立 Tag"

  # ════════════════════════════════════════════
  #  清理旧 Release
  # ════════════════════════════════════════════
  delete-releases:
    name: Delete Old Releases
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 勾选 do_releases 时运行；定时触发也运行
    if: ${{ inputs.do_releases || github.event_name == 'schedule' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete legacy date-tag releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "只删除旧式日期 tag（X1Pro-<8位日期>-<6位时间>）的 Release"
          echo "固定 tag（X1Pro-v24.10-*）的 Release 永不删除"

          releases=$(gh release list \
            --exclude-drafts \
            --limit 200 \
            --json tagName,publishedAt \
            --jq '.[] | "\(.publishedAt)|\(.tagName)"')

          if [ -z "$releases" ]; then
            echo "没有 Release"
            exit 0
          fi

          deleted=0
          kept=0

          while IFS='|' read -r published tag; do
            [ -z "$tag" ] && continue
            if [[ "$tag" =~ ^X1Pro-[0-9]{8}-[0-9]{6}$ ]]; then
              echo "  删除: $tag (发布于 $published)"
              gh release delete "$tag" --yes --cleanup-tag --repo ${{ github.repository }}
              deleted=$((deleted + 1))
            else
              echo "  保留: $tag (固定 tag / 其他)"
              kept=$((kept + 1))
            fi
          done <<< "$releases"

          echo ""
          echo "完成: 删除 ${deleted} 个, 保留 ${kept} 个"

  